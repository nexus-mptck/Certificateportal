{# Toast region. Call showToast(title, detail, 'success'|'error') from JS or emit server messages. #}
<div class="toast-region" id="toast-region" aria-live="polite"></div>
{% if messages %}
  <div hidden aria-hidden="true">
    {% for message in messages %}
      <div data-django-message="{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  </div>
{% endif %}
